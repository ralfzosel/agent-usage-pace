[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-usage-pace"
version = "0.1.1"
description = "Track Cursor, Claude Code, and Codex subscription usage against time elapsed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ralf Zosel"}]
keywords = ["cursor", "claude-code", "codex", "usage", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
agent-usage-pace = "usage_pace.cli:main"
usage-pace = "usage_pace.cli:main"
cursor-usage-pace = "usage_pace.cli:cursor_main"
claude-usage-pace = "usage_pace.cli:claude_main"
codex-usage-pace = "usage_pace.cli:codex_main"

[project.urls]
Homepage = "https://github.com/ralfzosel/agent-usage-pace"
Issues = "https://github.com/ralfzosel/agent-usage-pace/issues"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/usage_pace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
